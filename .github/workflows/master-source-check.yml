name: master-source-check
on:
  pull_request:
    branches: [master]
jobs:
  only-from-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Block PRs into master that don't come from testing
        run: |
          if [ "${{ github.head_ref }}" != "testing" ]; then
            echo "PRs into master must come from the testing branch."
            exit 1
          fi